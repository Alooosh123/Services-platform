name: Safe Dependency Lock Refresh

on:
  push:
    branches: ['fix/production-hardening-20261108']
    paths:
      - 'package.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - '.github/workflows/ci-cd-pipeline.yml'
      - '.github/workflows/dependency-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    name: Resolve compatible dependency tree and refresh lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile without force upgrades
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify reproducible install
        run: npm ci

      - name: Capture dependency audit report
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-report.json
          audit_exit=$?
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const v = report.metadata?.vulnerabilities || {};
          console.log(JSON.stringify({
            total: v.total || 0,
            critical: v.critical || 0,
            high: v.high || 0,
            moderate: v.moderate || 0,
            low: v.low || 0
          }, null, 2));
          NODE
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit refreshed lockfile
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add package-lock.json
            git commit -m "chore(deps): refresh lockfile with compatible security updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger full CI on refreshed dependency tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-cd-pipeline.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
