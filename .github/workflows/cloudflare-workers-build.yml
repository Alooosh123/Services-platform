name: Cloudflare Workers build validation

on:
  push:
    branches:
      - infra/northflank-cloudflare-neon-upstash
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-build-${{ github.ref }}-${{ matrix.app }}
  cancel-in-progress: true

jobs:
  worker-build:
    name: vinext Workers build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/web-customer
          - apps/web-admin
          - apps/web-saas
    env:
      # Compile-time placeholder only. This hostname is not a deploy target.
      NEXT_PUBLIC_API_URL: https://api.staging.invalid/api
      NEXT_PUBLIC_ENABLE_FINANCIAL_ADMIN_WRITES: "false"
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci
        working-directory: .

      - name: Initialize non-interactive Cloudflare Workers config
        run: >-
          npx --yes vinext@latest init
          --platform=cloudflare
          --cdn-cache=none
          --data-cache=none
          --image-optimization=none
          --no-prerender

      - name: Verify generated Workers configuration
        shell: bash
        run: |
          test -f vite.config.ts
          test -f cloudflare.config.ts
          node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts['build:vinext']) process.exit(1)"

      - name: Build production Workers output
        run: npm run build:vinext
