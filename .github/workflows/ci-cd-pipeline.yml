name: Yemen TopUp Platform - CI/CD Pipeline & Quality Gate (Phase 10)

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: Lint, Types & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Monorepo Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Monorepo Type Check
        run: npm run build --workspace=packages/shared && npm run build --workspace=packages/database
      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || true

  automated-tests:
    name: Backend Unit, Security & Stress Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: digital_topup_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/digital_topup_test_db?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test-jwt-access-token-secret-for-ci-pipeline-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "test-jwt-refresh-token-secret-for-ci-pipeline-minimum-32-chars-long"
      NODE_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build shared workspace
        run: npm run build --workspace=packages/shared
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Build database workspace
        run: npm run build --workspace=packages/database
      - name: Push Test Schema
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma
      - name: Seed Test Database
        run: npm run db:seed
      - name: Run Backend Unit & Security Test Suites (100% Pass Required)
        run: npm test --workspace=apps/backend

  migration-dryrun:
    name: Migration Dry-Run & Safety Check
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      DATABASE_URL: "postgresql://postgres:ci-only-not-used@localhost:5432/digital_topup_test_db?schema=public"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Prisma Schema Validation
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

  build-production:
    name: Build Monorepo Packages & Apps
    runs-on: ubuntu-latest
    needs: [automated-tests, migration-dryrun]
    env:
      DATABASE_URL: "postgresql://postgres:ci-only-not-used@localhost:5432/digital_topup_test_db?schema=public"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      # GitHub Actions jobs use isolated runners. Generated files from tests
      # are not shared, so recreate every local package artifact here.
      - name: Build shared workspace
        run: npm run build --workspace=packages/shared
      - name: Generate Prisma Client for package schema
        run: npm run db:generate
      - name: Build database workspace
        run: npm run build --workspace=packages/database
      - name: Build All Workspaces
        run: npm run build

  staging-deployment:
    name: Staging Deployment (Not Configured - Intentionally Skipped)
    runs-on: ubuntu-latest
    needs: build-production
    # Do not report a placeholder echo as a successful deployment or AT-20 drill.
    # Enable this job only after a real hosting provider, secrets, deployment
    # action, health probe, backup restore test, and rollback procedure are configured.
    if: ${{ false }}
    steps:
      - name: Deployment Not Configured
        run: echo "Staging deployment is intentionally disabled until a real deployment integration is configured."

  production-deployment:
    name: Production Deployment (Not Configured - Intentionally Skipped)
    runs-on: ubuntu-latest
    needs: staging-deployment
    # Production must remain unavailable until staging deployment and measured
    # disaster-recovery evidence are implemented and independently accepted.
    if: ${{ false }}
    steps:
      - name: Production Deployment Not Configured
        run: echo "Production deployment is intentionally disabled. No release was performed."
