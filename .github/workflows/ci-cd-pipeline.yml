name: Yemen TopUp Platform - CI, Security & Build Gates (Deployment Not Configured)

on:
  push:
    branches: [main, develop, 'release/*', 'production-completion', 'fix/**']
  pull_request:
    branches: [main, develop, 'production-completion']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis, Linting & Type Checking
  # -------------------------------------------------------------
  quality-gate:
    name: Lint, Types & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Monorepo Type Check
        run: npm run build --workspace=packages/shared && npm run build --workspace=packages/database

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

  # -------------------------------------------------------------
  # Job 2: Unit, Integration & Security Tests
  # -------------------------------------------------------------
  automated-tests:
    name: Backend Unit, Security & Stress Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: digital_topup_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/digital_topup_test_db?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test-jwt-access-token-secret-for-ci-pipeline-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "test-jwt-refresh-token-secret-for-ci-pipeline-minimum-32-chars-long"
      NODE_ENV: test
      SEED_SUPER_ADMIN_EMAIL: ci-admin@example.test
      SEED_SUPER_ADMIN_PASSWORD: ci-only-super-admin-password-32-chars
      SEED_FINANCE_PASSWORD: ci-only-finance-password-32-chars
      SEED_CUSTOMER_PASSWORD: ci-only-customer-password-32-chars

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Push Test Schema
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma

      - name: Seed Test Database
        run: npm run db:seed

      - name: Run Backend Unit & Security Test Suites (100% Pass Required)
        run: npm test --workspace=apps/backend

  # -------------------------------------------------------------
  # Job 3: Prisma Migration Dry-Run & Schema Safety Check
  # -------------------------------------------------------------
  migration-dryrun:
    name: Prisma Migration Apply & Safety Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/digital_topup_test_db?schema=public"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: digital_topup_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Schema Validation
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Apply all migrations to an empty PostgreSQL instance
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Verify deployed migration history
        run: npx prisma migrate status --schema=packages/database/prisma/schema.prisma

  # -------------------------------------------------------------
  # Job 4: Build Monorepo Production Artifacts
  # -------------------------------------------------------------
  build-production:
    name: Build Monorepo Packages & Apps
    runs-on: ubuntu-latest
    needs: [automated-tests, migration-dryrun, mobile-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build shared workspace
        run: npm run build --workspace=packages/shared

      - name: Build All Workspaces
        run: npm run build

  # -------------------------------------------------------------
  # Job 5: Flutter API-connected mobile static analysis and tests
  # -------------------------------------------------------------
  mobile-quality:
    name: Flutter Customer App Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/mobile-customer
        run: flutter pub get

      - name: Analyze Flutter Source
        working-directory: apps/mobile-customer
        run: flutter analyze

      - name: Run Flutter Unit Tests
        working-directory: apps/mobile-customer
        run: flutter test

  # No staging/production deployment jobs are defined yet.
  # This workflow is CI-only until a real host, DNS, TLS, protected secrets,
  # deployment action and endpoint-based health/restore verification are configured.
