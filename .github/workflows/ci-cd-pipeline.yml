name: Yemen TopUp Platform - CI/CD Pipeline & Quality Gate

permissions:
  contents: write
  pull-requests: read

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis, Linting & Type Checking
  # -------------------------------------------------------------
  quality-gate:
    name: Lint, Types & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Resolve patched lockfile without forcing major framework upgrades
        run: npm install --package-lock-only --ignore-scripts

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Persist reviewed lockfile updates on release branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): refresh patched npm dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Monorepo Type Check
        run: npm run build --workspace=packages/shared && npm run build --workspace=packages/database

      - name: Security Vulnerability Audit (high and critical findings fail the build)
        run: npm audit --audit-level=high

      - name: Review dependency changes on pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # -------------------------------------------------------------
  # Job 2: Unit, Integration & Security Tests
  # -------------------------------------------------------------
  automated-tests:
    name: Backend Unit, Security & Stress Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: digital_topup_test_db
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci-user-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "mysql://ci_user:ci-user-password@127.0.0.1:3306/digital_topup_test_db"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test-jwt-access-token-secret-for-ci-pipeline-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "test-jwt-refresh-token-secret-for-ci-pipeline-minimum-32-chars-long"
      NODE_ENV: test
      SEED_SUPER_ADMIN_EMAIL: ci-admin@example.invalid
      SEED_SUPER_ADMIN_PASSWORD: ci-only-bootstrap-password-at-least-20-chars

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Resolve lockfile using pinned security overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Install Dependencies
        run: npm ci

      - name: Push Test Schema
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma

      - name: Seed Test Database
        run: npm run db:seed

      - name: Run Backend Unit & Security Test Suites (100% Pass Required)
        run: npm test --workspace=apps/backend

  # -------------------------------------------------------------
  # Job 3: Prisma Migration Dry-Run & Schema Safety Check
  # -------------------------------------------------------------
  migration-dryrun:
    name: MySQL 8.4 Baseline Migration Generation and Apply
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: digital_topup_migration_test
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci-user-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "mysql://ci_user:ci-user-password@127.0.0.1:3306/digital_topup_migration_test"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Schema Validation (MySQL)
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Generate fresh MySQL baseline migration
        run: |
          mkdir -p packages/database/prisma/migrations/20261113120000_initial_mysql
          npx prisma migrate diff --from-empty --to-schema-datamodel packages/database/prisma/schema.prisma --script --output=packages/database/prisma/migrations/20261113120000_initial_mysql/migration.sql

      - name: Apply baseline to empty isolated MySQL 8.4 database
        run: |
          npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
          npx prisma migrate status --schema=packages/database/prisma/schema.prisma

      - name: Upload generated MySQL baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: mysql-initial-migration
          path: packages/database/prisma/migrations/20261113120000_initial_mysql/migration.sql
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------
  # Job 4: Build Monorepo Production Artifacts
  # -------------------------------------------------------------
  build-production:
    name: Build Monorepo Packages & Apps
    runs-on: ubuntu-latest
    needs: [automated-tests, migration-dryrun]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Workspaces
        run: npm run build

  # -------------------------------------------------------------
  # Job 5: Deploy to Staging & Automated Health Smoke Test
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging & Run AT-20 Drill
    runs-on: ubuntu-latest
    needs: build-production
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Fail closed until real staging deployment and restore-drill evidence exists
        run: |
          echo "::error::Staging deployment, live health probes, backup restore, and ledger-conservation checks are not executable yet. Promotion is blocked."
          exit 1

  # -------------------------------------------------------------
  # Job 6: Gated Production Deployment with Rollback Trigger
  # -------------------------------------------------------------
  deploy-production:
    name: Gated Production Release (Manual Approval Required)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://yementopup.com
    steps:
      - name: Fail closed until production deployment and live smoke tests are configured
        run: |
          echo "::error::No production deployment adapter or live smoke-test credentials are configured. A successful CI build is not production approval."
          exit 1
