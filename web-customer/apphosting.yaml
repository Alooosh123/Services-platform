# Firebase App Hosting Configuration for Next.js 14 SSR
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_API_URL
    value: "http://localhost:4000/api"
  - variable: NEXT_PUBLIC_SITE_NAME
    value: "Digital TopUp Platform"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "gen-lang-client-0750103757"
